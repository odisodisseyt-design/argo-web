<!doctype html>
<html lang="ru" class="dark" data-world="system-apocalypse">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="description" content="ARGO — многопользовательская AI-RPG с живым игровым миром. Исследуйте миры, ведите кампании, принимайте решения с последствиями." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/web/icons/argo-512.png" />
    <link rel="apple-touch-icon" href="/web/icons/argo-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <title>ARGO — живые миры AI-RPG</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('argo-ui') || '{}').state?.theme || 'dark'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
